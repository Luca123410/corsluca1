<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configura Addon TMDB & Real-Debrid</title>
    <style>
        :root {
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --text-color: #e0e0e0;
            --accent-color: #7b68ee; /* MediumSlateBlue */
            --accent-hover: #6a5acd;
            --input-bg: #2a2a2a;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 { margin: 0 0 10px 0; color: white; }
        
        .subtitle { color: #aaa; font-size: 0.9rem; margin-bottom: 2rem; }

        .form-group { margin-bottom: 1.5rem; text-align: left; }
        
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #ddd; }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box; /* Importante per il padding */
        }

        input:focus { outline: none; border-color: var(--accent-color); }

        .help-text { font-size: 0.75rem; color: #777; margin-top: 5px; }
        .help-text a { color: var(--accent-color); text-decoration: none; }

        .buttons { display: flex; flex-direction: column; gap: 12px; margin-top: 2rem; }

        button {
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        #installBtn { background-color: var(--accent-color); color: white; }
        #installBtn:hover { background-color: var(--accent-hover); transform: translateY(-1px); }

        #copyBtn { background-color: transparent; border: 1px solid #444; color: #ccc; }
        #copyBtn:hover { border-color: #888; color: white; }

        #message { margin-top: 15px; font-size: 0.85rem; min-height: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Setup Addon</h1>
        <p class="subtitle">Corsaro Nero & Real-Debrid</p>

        <div class="form-group">
            <label>TMDB API Key</label>
            <input type="text" id="tmdb" placeholder="Inserisci API Key TMDB">
            <div class="help-text"><a href="https://www.themoviedb.org/settings/api" target="_blank">Prendila qui ↗</a></div>
        </div>

        <div class="form-group">
            <label>Real-Debrid Token</label>
            <input type="text" id="rd" placeholder="Inserisci Token RD">
            <div class="help-text"><a href="https://real-debrid.com/apitoken" target="_blank">Prendilo qui ↗</a></div>
        </div>

        <div class="buttons">
            <button id="installBtn" onclick="install()">🚀 Installa su Stremio</button>
            <button id="copyBtn" onclick="copyLink()">📋 Copia Link</button>
        </div>

        <div id="message"></div>
    </div>

    <script>
        function generateStremioLink() {
            const tmdb = document.getElementById('tmdb').value.trim();
            const rd = document.getElementById('rd').value.trim();

            if (!tmdb || !rd) {
                showMessage("⚠️ Compila tutti i campi!", "#ffcc00");
                return null;
            }

            // Creiamo la configurazione
            const config = { tmdb, rd };
            const configB64 = btoa(JSON.stringify(config));

            // Otteniamo l'host corrente (es. omg-luca.ydns.eu)
            const host = window.location.host;
            
            // Costruiamo l'URL
            // NOTA: Usiamo SEMPRE stremio:// per evitare l'errore "Unsupported protocol"
            // Nginx Proxy Manager gestirà il traffico HTTPS anche se il link inizia così.
            return `stremio://${host}/${configB64}/manifest.json`;
        }

        function install() {
            const link = generateStremioLink();
            if (link) {
                window.location.href = link;
            }
        }

        function copyLink() {
            const link = generateStremioLink();
            if (!link) return;

            navigator.clipboard.writeText(link).then(() => {
                showMessage("✅ Copiato! Incollalo nella ricerca di Stremio.", "#4caf50");
            }).catch(() => {
                showMessage("❌ Errore copia.", "#f44336");
            });
        }

        function showMessage(text, color) {
            const msg = document.getElementById('message');
            msg.style.color = color;
            msg.innerText = text;
            setTimeout(() => msg.innerText = "", 4000);
        }
    </script>

</body>
</html>
